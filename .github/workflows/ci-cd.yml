name: CI-CD 1Money

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # CI 1: lint + unit test
  # ---------------------------------------------------------------
  test:
    name: Lint dan Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependensi
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit test (pytest)
        run: python -m pytest


  # ---------------------------------------------------------------
  # CI 2: build image container + smoke test
  # ---------------------------------------------------------------
  build:
    name: Build Image dan Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image dengan Docker
        run: |
          docker build -t 1money:ci .

      - name: Smoke test container
        run: |
          docker run -d \
            --name kas-test \
            -p 8000:8000 \
            1money:ci

          echo "Menunggu container siap..."

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Smoke test berhasil!"
              exit 0
            fi

            echo "Menunggu container siap (percobaan $i/30)..."
            sleep 2
          done

          echo "Smoke test gagal!"

          echo "=== STATUS CONTAINER ==="
          docker ps -a

          echo "=== LOG CONTAINER ==="
          docker logs kas-test

          exit 1

      - name: Build image yang sama dengan Podman
        run: |
          podman --version
          podman build -t 1money:podman-ci .


  # ---------------------------------------------------------------
  # CD 1: publish image ke GitHub Container Registry
  # ---------------------------------------------------------------
  publish:
    name: Publish Image ke GHCR
    runs-on: ubuntu-latest
    needs: build

    # Bisa berjalan melalui push main ATAU Run workflow
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.nama.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Nama image (huruf kecil)
        id: nama
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nama.outputs.image }}:latest
            ${{ steps.nama.outputs.image }}:${{ github.sha }}


  # ---------------------------------------------------------------
  # CD 2: deploy otomatis memakai Podman
  # ---------------------------------------------------------------
  deploy:
    name: Deploy dengan Podman
    runs-on: [self-hosted, linux, podman]
    needs: publish

    permissions:
      contents: read
      packages: read

    steps:

      # -----------------------------------------------------------
      # Login ke GHCR
      # -----------------------------------------------------------
      - name: Login ke GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin


      # -----------------------------------------------------------
      # Pull image terbaru
      # -----------------------------------------------------------
      - name: Pull image terbaru
        run: |
          podman pull ${{ needs.publish.outputs.image }}:latest


      # -----------------------------------------------------------
      # Hapus container lama
      # -----------------------------------------------------------
      - name: Hapus container lama
        run: |
          podman rm -f 1money || true


      # -----------------------------------------------------------
      # Jalankan container baru
      # -----------------------------------------------------------
      - name: Jalankan container baru
        run: |
          podman run -d \
            --name 1money \
            -p 8080:8000 \
            -v 1money-data:/data:Z \
            --restart=always \
            ${{ needs.publish.outputs.image }}:latest


      # -----------------------------------------------------------
      # Cek status container
      # -----------------------------------------------------------
      - name: Cek status container
        run: |
          sleep 5

          echo "=== STATUS CONTAINER ==="
          podman ps -a

          echo "=== PORT CONTAINER ==="
          podman port 1money


      # -----------------------------------------------------------
      # Health check
      # -----------------------------------------------------------
      - name: Health check
        run: |
          echo "Menunggu aplikasi 1money di port 8080..."

          for i in $(seq 1 30); do

            if curl -fsS http://localhost:8080/health; then
              echo ""
              echo "======================================"
              echo "Container 1money berhasil berjalan!"
              echo "Health check berhasil!"
              echo "======================================"
              exit 0
            fi

            echo "Menunggu aplikasi 1money di port 8080 (percobaan $i/30)..."
            sleep 2

          done

          echo ""
          echo "======================================"
          echo "HEALTH CHECK GAGAL"
          echo "======================================"

          echo ""
          echo "=== STATUS CONTAINER ==="
          podman ps -a

          echo ""
          echo "=== PORT CONTAINER ==="
          podman port 1money || true

          echo ""
          echo "=== LOG CONTAINER ==="
          podman logs 1money

          exit 1