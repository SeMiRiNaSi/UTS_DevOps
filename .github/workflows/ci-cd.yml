name: CI-CD 1Money

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # CI 1: lint + unit test
  # ---------------------------------------------------------------
  test:
    name: Lint dan Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependensi
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit test (pytest)
        run: python -m pytest

  # ---------------------------------------------------------------
  # CI 2: build image container + smoke test
  # ---------------------------------------------------------------
  build:
    name: Build Image dan Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image dengan Docker
        run: docker build -t 1money:ci .

      - name: Smoke test container (Docker)
        run: |
          docker run -d --name kas-test -p 8000:8000 1money:ci
          sleep 5
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0 || sleep 2
          done
          docker logs kas-test
          exit 1

      - name: Build image yang sama dengan Podman (verifikasi kompatibilitas)
        run: |
          podman --version
          podman build -t 1money:podman-ci .

  # ---------------------------------------------------------------
  # CD 1: publish image ke GitHub Container Registry (hanya branch main)
  # ---------------------------------------------------------------
  publish:
    name: Publish Image ke GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nama.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (huruf kecil)
        id: nama
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nama.outputs.image }}:latest
            ${{ steps.nama.outputs.image }}:${{ github.sha }}

  # ---------------------------------------------------------------
  # CD 2: deploy otomatis memakai Podman pada runner self-hosted
  # (mesin/VM Linux milik salah satu anggota; lihat panduan Bagian 6)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy dengan Podman
    runs-on: [self-hosted, linux, podman]
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login ke GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image terbaru
        run: podman pull ${{ needs.publish.outputs.image }}:latest

      - name: Ganti container lama dengan yang baru
        run: |
          podman rm -f 1money || true
          podman run -d --name 1money \
            -p 8080:8000 \
            -v 1money-data:/data:Z \
            --restart=always \
            ${{ needs.publish.outputs.image }}:latest

      - name: Health check
        run: |
          sleep 5
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/health && exit 0 || sleep 2
          done
          podman logs 1money
          exit 1