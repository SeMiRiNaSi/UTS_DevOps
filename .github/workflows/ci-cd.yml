name: CI-CD 1Money

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner untuk tahap deploy"
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

env:
  REGISTRY: ghcr.io

# Batalkan run lama pada branch/PR yang sama agar tidak menumpuk
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # CI 1: lint + unit test
  # ---------------------------------------------------------------
  test:
    name: Lint dan Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependensi
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit test (pytest)
        run: pytest -v

  # ---------------------------------------------------------------
  # CI 2: build image container + smoke test
  # ---------------------------------------------------------------
  build:
    name: Build Image dan Smoke Test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image dengan Docker
        run: docker build -t 1money:ci .

      - name: Smoke test container (Docker)
        run: |
          docker run -d --name kas-test -p 8000:8000 1money:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Smoke test lulus"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test gagal, log container:"
          docker logs kas-test
          exit 1

      - name: Bersihkan container smoke test
        if: always()
        run: docker rm -f kas-test || true

      - name: Build image yang sama dengan Podman (verifikasi kompatibilitas)
        run: |
          podman --version
          podman build -t 1money:podman-ci .

  # ---------------------------------------------------------------
  # CD 1: publish image ke GitHub Container Registry (hanya branch main)
  # ---------------------------------------------------------------
  publish:
    name: Publish Image ke GHCR
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Jalan pada push ke main DAN pada run manual (workflow_dispatch)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nama.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (huruf kecil)
        id: nama
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Membutuhkan "ARG APP_VERSION" di Dockerfile (lihat catatan perbaikan)
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Label ini menautkan package GHCR ke repositori sehingga
          # GITHUB_TOKEN pada job deploy boleh melakukan pull
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.nama.outputs.image }}:latest
            ${{ steps.nama.outputs.image }}:${{ github.sha }}

  # ---------------------------------------------------------------
  # CD 2: deploy otomatis memakai Podman
  # Default: runner GitHub (ubuntu-latest, Podman sudah terpasang) sehingga
  # deploy selalu jalan tanpa perlu menyiapkan mesin sendiri.
  # Untuk memakai runner self-hosted (Linux/WSL2, label: self-hosted, linux,
  # podman, status Idle), pilih "self-hosted" saat run manual, atau buat
  # repository variable DEPLOY_RUNNER = self-hosted agar berlaku pada push.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy dengan Podman
    runs-on: ${{ (inputs.runner == 'self-hosted' || vars.DEPLOY_RUNNER == 'self-hosted') && fromJSON('["self-hosted","linux","podman"]') || 'ubuntu-latest' }}
    needs: publish
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Cek Podman
        run: podman --version

      - name: Login ke GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Pull image sesuai commit
        run: podman pull ${{ needs.publish.outputs.image }}:${{ github.sha }}

      - name: Ganti container lama dengan yang baru
        run: |
          podman rm -f 1money || true
          podman run -d --name 1money \
            -p 8080:8000 \
            -v 1money-data:/data:Z \
            --restart=always \
            ${{ needs.publish.outputs.image }}:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo
              echo "Deploy berhasil, aplikasi sehat"
              exit 0
            fi
            sleep 2
          done
          echo "Health check gagal, log container:"
          podman logs 1money
          exit 1

      - name: Logout GHCR
        if: always()
        run: podman logout ghcr.io || true